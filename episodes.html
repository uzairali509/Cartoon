          <circle cx="80" cy="64" r="4.5" fill="#FF5A3C" opacity=".4" />

      <div class="cloud c2"><img src="assets/svg/cloud.svg" alt="" /></div>
      <div class="cloud c3"><img src="assets/svg/cloud.svg" alt="" /></div>
      <div class="cloud c4"><img src="assets/svg/cloud.svg" alt="" /></div>
    </div>

    <svg class="hills" viewBox="0 0 1440 320" preserveAspectRatio="xMidYMax slice" aria-hidden="true">

      </g>
      <path d="M0 272 Q260 214 520 262 Q780 302 1040 256 Q1270 222 1440 266 V320 H0 Z" fill="#55B374" />
      <g fill="#3E9A63">
        <circle cx="300" cy="286" r="18" />
        <circle cx="880" cy="282" r="22" />
        <circle cx="1340" cy="280" r="16" />
      </g>
    </svg>

    <div class="floater f-fox" title="Ember"><span class="bob"><img src="assets/svg/fox.svg" alt="" style="width:100%;height:100%;" /></span></div>
    <div class="floater f-bunny" title="Pip"><span class="bob"><img src="assets/svg/bunny.svg" alt="" style="width:100%;height:100%;" /></span></div>
    <div class="floater f-star" title="Twinkle"><span class="bob"><img src="assets/svg/star.svg" alt="" style="width:100%;height:100%;" /></span></div>
    <div class="floater f-balloon"><span class="bob"><img src="assets/svg/balloon.svg" alt="" style="width:100%;height:100%;" /></span></div>
    <div id="particles"></div>

    <header class="site-head">
      <a class="brand" href="index.html">
        <span class="badge"><svg viewBox="0 0 24 24">
            <path d="M12 2.5l2.6 5.9 6.4.6-4.9 4.2 1.5 6.3L12 16.3 6.4 19.5l1.5-6.3L3 9l6.4-.6z" fill="#FFFDF7" />
          </svg></span>
        <span>Cartoon Universe</span>

      <nav id="mainNav" aria-label="Main navigation">

    <main class="page-wrap">
      <section class="page-card">
        <header class="page-head">
          <h1 class="page-title">FRESH EPISODES</h1>
          <p class="page-sub">Tap an episode to press play.</p>
        </header>
        <div data-stagger>
          <button class="ep-row" data-title="The Great Jam Heist">
            <span class="ep-play"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z" fill="currentColor"/></svg></span>
            <span class="ep-info">
              <span class="ep-tag">EP 12 · 11 MIN</span>
              <span class="ep-name">The Great Jam Heist</span>
            </span>
            <span class="new-badge">NEW</span>
          </button>
          <button class="ep-row" data-title="Cloud Surfing 101">
            <span class="ep-play"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z" fill="currentColor"/></svg></span>
            <span class="ep-info">
              <span class="ep-tag">EP 11 · 9 MIN</span>
              <span class="ep-name">Cloud Surfing 101</span>
            </span>
          </button>
          <button class="ep-row" data-title="Bruno's Big Nap">
            <span class="ep-play"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z" fill="currentColor"/></svg></span>
            <span class="ep-info">
              <span class="ep-tag">EP 10 · 12 MIN</span>

            </span>
          </button>
          <button class="ep-row" data-title="The Star Who Lost Her Shine">

            <span class="ep-info">
              <span class="ep-tag">EP 8 · 9 MIN</span>
              <span class="ep-name">Miso Machine Mayhem</span>
            </span>
          </button>
        </div>
      </section>

  <div id="svgAssets" hidden>
    <div id="asset-star"><img src="assets/svg/star-pop.svg" alt="" /></div>
